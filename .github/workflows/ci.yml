name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 质量门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 字段决定，这里不再重复指定，
      # 否则 action-setup 会因「两处版本冲突」直接失败
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Token CSS（变量校验要读它，干净检出时不存在）
        run: pnpm build:tokens

      - name: 代码风格（ESLint + Stylelint）
        run: pnpm lint

      - name: 命名规范
        run: pnpm lint:naming

      - name: 图标离线集合
        run: pnpm lint:icons

      - name: 构建
        run: pnpm build

      # 演示站不在仓库里，根 typecheck 会连带过滤 playground 而失败，CI 只查包
      - name: 类型检查
        run: pnpm -r --filter "./packages/*" typecheck

      - name: 单元测试
        run: pnpm test

      - name: 产物校验
        run: pnpm verify:dist
